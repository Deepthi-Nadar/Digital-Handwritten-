<!DOCTYPE html>
<html>

<head>
    <title>Digit Prediction</title>

    <link---
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <h2>Upload Handwritten Digit Image (28x28)</h2>

    <form
        method="POST"
        action="/predict"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Predict
        </button>

    </form>

    <a href="/logout">
        Logout
    </a>

</body>

</html>
