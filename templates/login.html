<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <h2>Login to Use Digit Recognition</h2>

    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/">

        Username:
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        Password:
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
